version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install dependencies with pnpm
    cmds:
      - pnpm install

  test:
    desc: Run parser, capture, tracker, rendering and extension tests
    cmds:
      - pnpm test

  typecheck:
    desc: Check TypeScript without emitting files
    cmds:
      - pnpm typecheck

  check:
    desc: Run tests and typecheck
    cmds:
      - task: test
      - task: typecheck

  preview:
    desc: Render sample cards with Pi's theme to .scratch/cards.png
    cmds:
      - mkdir -p .scratch
      - FORCE_COLOR=3 COLORTERM=truecolor pnpm -s preview > .scratch/cards.ans
      - uv run -q scripts/shot.py .scratch/cards.ans .scratch/cards.png 100 400

  demo:
    desc: Run real Pi with a scripted model and screenshot every scenario into .scratch/
    cmds:
      - mkdir -p .scratch
      - for: ['logger', 'parallel', 'no-git']
        cmd: uv run -q scripts/demo/run.py scripts/demo/scenarios/{{.ITEM}}.json .scratch/demo-{{.ITEM}} --expand --rows 90

  screenshot:
    desc: Regenerate the README screenshot
    cmds:
      - uv run -q scripts/demo/run.py scripts/demo/scenarios/logger.json .scratch/readme --columns 100 --rows 70 --crop '$ python3' 'Done.'
      - cp .scratch/readme.png docs/card.png

  corpus:
    desc: Stream Bash calls from local Claude Code, Codex and Pi transcripts into the private corpus
    cmds:
      - pnpm corpus

  eval:sample:
    desc: Draw a stratified per-model labeling sample from the corpus into .local/eval (then label it; see scripts/eval-rubric.md)
    cmds:
      - pnpm sample

  eval:
    desc: Score the parser against the private labeled sample, per model family and overall
    cmds:
      - pnpm eval
